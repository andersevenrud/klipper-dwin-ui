[project]
name = "dwinui"
version = "0.1.0"
description = "KlipperScreen-like UI for the Ender 3 V2 DWIN display, driven over Moonraker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial-asyncio-fast>=0.14",
    "websockets>=13",
]

[project.optional-dependencies]
sim = ["pillow>=10.1"]
dev = ["pillow>=10.1", "pytest>=8"]

[project.scripts]
dwinui = "dwinui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dwinui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
