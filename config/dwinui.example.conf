# dwinui configuration. Lives at ~/printer_data/config/dwinui.conf so it can
# be edited from Mainsail/Fluidd.

[display]
# Serial device of the RP2040 bridge's data port. /dev/dwin comes from the
# udev rule; a glob like /dev/serial/by-id/usb-dwinui_DWIN_Bridge_*-if02 works too.
port: /dev/dwin
# bridge = RP2040 bridge (input + beeper over USB)
# serial = plain USB-UART adapter (display only, no input)
backend: bridge
baud: 115200
brightness: 255
# Dim the backlight after this many idle seconds (0 = never)
dim_timeout: 120
dim_brightness: 24
long_press_ms: 600
invert_encoder: false
beep_on_click: false
beep_ms: 20
# Set to true after flashing build/DWIN_SET (Terminus font, icons, splash)
custom_assets: false

[moonraker]
url: ws://localhost:7125/websocket
# api_key: only needed if localhost isn't in trusted_clients

[ui]
max_extruder_temp: 300
max_bed_temp: 120
min_extrude_temp: 170
# mm/min
xy_feedrate: 3000
z_feedrate: 600
extrude_feedrate: 300
# mm per encoder detent in Tune > Z offset
babystep: 0.01
confirm_estop: true
confirm_macros: true
show_hidden_macros: false

[preset PLA]
extruder: 200
heater_bed: 60

[preset PETG]
extruder: 235
heater_bed: 80

[preset ABS]
extruder: 250
heater_bed: 100
