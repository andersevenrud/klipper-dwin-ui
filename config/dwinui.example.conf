# Settings for dwinui, the Ender 3 V2 display UI
# (https://github.com/andersevenrud/klipper-dwin-ui).
#
# This is not a Klipper config file: Klipper never reads it, so don't
# [include] it from printer.cfg. Changes take effect when dwinui restarts
# (sudo systemctl restart dwinui, or from Mainsail/Fluidd's service menu).

[display]
# Serial device of the RP2040 bridge's data port. /dev/dwin comes from the
# udev rule; a glob like /dev/serial/by-id/usb-dwinui_DWIN_Bridge_*-if02 works too.
port: /dev/dwin
# bridge = RP2040 bridge (input + beeper over USB)
# serial = plain USB-UART adapter (display only, no input)
# pi     = Raspberry Pi UART + GPIO (run install/setup-pi-gpio.sh first;
#          port then defaults to /dev/serial0)
backend: bridge
baud: 115200
# Brightness, jog step and extrude length/speed changed on the display are
# saved in Moonraker's database and take priority over the values here, until
# System > Reset display settings.
brightness: 255
# Dim the backlight after this many idle seconds (0 = never)
dim_timeout: 120
dim_brightness: 24
# Hold the knob this long (ms) to go back, or to cancel an edit
long_press_ms: 600
invert_encoder: false
beep_on_click: false
beep_ms: 20
# Uses the flashed asset pack (font, icons, boot logo). Set to false if the
# display still has its stock files, or symbols and icons will look wrong.
custom_assets: true
# backend: pi only. Input devices are found by name unless set here.
#encoder_device: /dev/input/by-path/platform-rotary@11-event
#button_device: /dev/input/by-path/platform-button@16-event
#beeper_pwm: /sys/class/pwm/pwmchip0
#beeper_hz: 2700

[moonraker]
url: ws://localhost:7125/websocket
# api_key: only needed if localhost isn't in trusted_clients

[ui]
max_extruder_temp: 300
max_bed_temp: 120
min_extrude_temp: 170
# mm/min
xy_feedrate: 3000
z_feedrate: 600
extrude_feedrate: 300
# mm per encoder detent in Tune > Z offset
babystep: 0.01
# Sensor rows on the home screen (hotend and bed included). With more
# sensors than this, turning the knob on the home screen scrolls the rest.
dashboard_rows: 8
# Files listed under Print > Recent prints (from Moonraker's print history);
# 0 hides the entry.
recent_prints: 10
confirm_estop: true
confirm_macros: true
show_hidden_macros: false

[preset PLA]
extruder: 200
heater_bed: 60

[preset PETG]
extruder: 235
heater_bed: 80

[preset ABS]
extruder: 250
heater_bed: 100
